<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NFToken Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
      <h1 class="text-xl md:text-2xl font-bold text-indigo-400">Netflix NFToken Dashboard</h1>
      <div class="bg-indigo-900/50 border border-indigo-500 text-indigo-200 px-4 py-2 rounded-lg font-semibold text-sm">
        Active Tokens: <span id="activeCount" class="text-white font-bold">0</span>
      </div>
    </div>

    <!-- Import Section -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
      <h2 class="text-lg font-semibold text-gray-200">Import Raw Cookies</h2>
      
      <div class="border-2 border-dashed border-gray-600 hover:border-indigo-500 rounded-lg p-6 text-center bg-gray-900/50 cursor-pointer transition" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" class="hidden" accept="*/*" multiple onchange="handleFileUpload(event)">
        <p class="text-sm font-medium text-gray-300">Click to upload cookie file or paste below</p>
      </div>

      <textarea id="jsonInput" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 font-mono" placeholder="Paste cookie arrays here..."></textarea>
      
      <button onclick="importCookies()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-lg transition shadow-lg">
        Generate Real NFTokens
      </button>
    </div>

    <!-- Table -->
    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-950 text-gray-400 text-xs uppercase">
          <tr>
            <th class="p-4">Account Email</th>
            <th class="p-4">Status</th>
            <th class="p-4">NFToken String</th>
            <th class="p-4">Actions</th>
          </tr>
        </thead>
        <tbody id="accountTable" class="divide-y divide-gray-700 text-sm">
          <tr><td colspan="4" class="p-4 text-center text-gray-500">Loading inventory...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadInventory() {
      try {
        const res = await fetch('/api/inventory');
        const data = await res.json();
        document.getElementById('activeCount').innerText = data.total_active;
        
        const tbody = document.getElementById('accountTable');
        tbody.innerHTML = '';
        
        if (!data.accounts || data.accounts.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No tokens generated yet.</td></tr>`;
          return;
        }

        data.accounts.forEach(acc => {
          const statusBadge = acc.status === 'active' 
            ? '<span class="bg-green-900 text-green-300 text-xs px-2.5 py-1 rounded-full">Active</span>' 
            : '<span class="bg-red-900 text-red-300 text-xs px-2.5 py-1 rounded-full">Inactive</span>';

          tbody.innerHTML += `
            <tr class="hover:bg-gray-750">
              <td class="p-4 font-medium">${acc.user_identifier}</td>
              <td class="p-4">${statusBadge}</td>
              <td class="p-4 font-mono text-xs text-indigo-300 truncate max-w-xs">${acc.token_string}</td>
              <td class="p-4 flex gap-2">
                <button onclick="navigator.clipboard.writeText('${acc.token_string}'); alert('NFToken Copied!')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-xs">Copy Token</button>
                <a href="${acc.launch_url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-xs text-center">Open Link</a>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    function handleFileUpload(event) {
      const files = event.target.files;
      if (!files.length) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('jsonInput').value = e.target.result;
      };
      reader.readAsText(files[0]);
    }

    async function importCookies() {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) return alert('Please provide cookie data.');

      const res = await fetch('/api/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw_data: raw })
      });
      const data = await res.json();

      if (data.success) {
        alert(`Successfully generated ${data.count} real NFTokens!`);
        document.getElementById('jsonInput').value = '';
        loadInventory();
      } else {
        alert('Error: ' + data.error);
      }
    }

    loadInventory();
  </script>
</body>
</html>
